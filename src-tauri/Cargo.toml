[package]
name = "theta"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "theta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Embed the Vosk model into the binary for standalone distribution
embed-model = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
vosk = "0.3"
cpal = "=0.18.0"
# Pin windows crates to a single minor so cpal's `>=0.61, <=0.62` ranges
# resolve consistently (cpal allows windows 0.61.3 + windows-core 0.62.2,
# which breaks cross-version trait impls). 0.61 matches what tauri/tao use.
windows = "0.61"
windows-core = "0.61"
crossbeam-channel = "0.5"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
tauri-plugin-autostart = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
